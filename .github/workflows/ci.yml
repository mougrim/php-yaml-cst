name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.php-version }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.4', '8.5']
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-args: SOURCE_IMAGE=php:${{ matrix.php-version }}-cli
          tags: mougrim/yaml-cst-dev:ci-${{ matrix.php-version }}
          load: true
          cache-from: type=gha,scope=build-${{ matrix.php-version }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.php-version }}

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/composer-cache
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php-version }}-

      - name: Install Composer dependencies
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -v "${{ runner.temp }}/composer-cache:/root/.composer/cache" \
            -w /app \
            mougrim/yaml-cst-dev:ci-${{ matrix.php-version }} \
            composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            mougrim/yaml-cst-dev:ci-${{ matrix.php-version }} \
            vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run PHPStan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            mougrim/yaml-cst-dev:ci-${{ matrix.php-version }} \
            vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Run PHPUnit
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            mougrim/yaml-cst-dev:ci-${{ matrix.php-version }} \
            vendor/bin/phpunit --log-junit /app/test-results.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml
